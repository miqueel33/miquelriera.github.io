<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentació B1</title>
  <link rel="icon" type="image/x-icon" href="../logo.ico" />
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>


  <style> 

  body{
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f5f7fb;
    margin: 40px;
}

/* Contenedor de la tabla */
.table-container{
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    overflow: hidden;
    max-width: 1000px;
}

/* Tabla */
table{
    width: 100%;
    border-collapse: collapse;
}

/* Encabezado */
th{
    text-align: left;
    background-color: #f1f3f6;
    padding: 14px 16px;
    font-size: 14px;
    color: #444;
    font-weight: 600;
    border-bottom: 1px solid #e6e8ec;
}

/* Celdas */
td{
    padding: 14px 16px;
    font-size: 14px;
    color: #333;
    border-bottom: 1px solid #eef0f2;
}

/* Hover fila */
tr:hover td{
    background-color: #f9fbff;
    transition: 0.2s;
}

/* Link descarga */
a{
    color: #2b6cff;
    text-decoration: none;
    font-weight: 500;
}

a:hover{
    text-decoration: underline;
}

  </style> 
  <div class="table-container">
  <table>
    <tr>
        <th>Títol</th>
        <th>Nom Document</th>
        <th>Url</th>
    </tr>

    <tr>
        <td>Document</td>
        <td>Acta del Consell d'Educació, 22 de gener de 2026</td>
        <td>
            <a href="../ftp/ftp.pdf" download>Enllaç</a>
        </td>
    </tr>
</table>
  </div>

</body>
</html>
